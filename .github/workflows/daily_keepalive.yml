name: Daily Keep-Alive Bot Check-in

on:
  schedule:
    # Runs every 12 hours at 9:00 AM & 9:00 PM IST (03:30 UTC and 15:30 UTC)
    - cron: '30 3,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Daily Keep-Alive Check-in
        run: |
          python backend/scripts/daily_bot_checkin.py
